coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery-server.enabled=true
discovery.uri=http://presto:8080

# Bound what one query may hold, against the 2G heap in jvm.config. Without
# these a single wide scan grows until the JVM dies and takes every other
# in-flight query with it; with them the offending query fails on its own and
# the rest of the dashboard keeps rendering.
query.max-memory=1GB
query.max-memory-per-node=512MB
query.max-total-memory-per-node=768MB
memory.heap-headroom-per-node=512MB
